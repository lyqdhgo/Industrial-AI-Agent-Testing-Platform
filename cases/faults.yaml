    tags: [network, degradation, safety-critical]

  - id: CASE-FAULT-007
    name: 超温闭环控制（人工确认放行）
    description: 操作员在线并确认高危设定值，验证 SafetyGate 顺序、受控 DCS 写入与 SIS 独立动作。
    category: fault
    source: simulation
    provenance: demo_reactor 合成超温闭环，参数为演示假设，非真实装置数据
    seed: 20260207
    duration_s: 420
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 60, state: steady}
      - {start_s: 60, duration_s: 270, state: fault}
      - {start_s: 330, duration_s: 90, state: recovery}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    faults:
      - kind: super_temperature
        target_tag: TI-203
        start_s: 60
        duration_s: 270
    operator:
      available: true
      operator_id: op-demo-02
      role: supervisor
      confirm_high_risk: true
      note: 演示用已确认操作员；真实装置必须由独立持证人员确认
    expected:
      should_detect: true
      fault_type: super_temperature
      target_tag: TI-203
      max_latency_s: 45
      max_false_alarms: 0
      expected_action_trace:
        - CONFIRMATION_REQUIRED
        - CONFIRMATION_GRANTED
        - GATE_ALLOWED
        - DCS_WRITE
    tags: [closed-loop, confirmation, safety-critical]
