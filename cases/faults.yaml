# 故障注入用例。所有参数来自演示故障库，属于合成假设，不是真实装置机理数据。
cases:
  - id: CASE-FAULT-001
    name: 入口温度失控上升
    description: 90 秒后热失控斜坡叠加到真实温度，验证早期检出、误报控制及 SIS 独立动作。
    category: fault
    source: simulation
    provenance: demo_reactor 合成超温故障，参数为演示假设，非真实装置数据
    seed: 20260201
    duration_s: 420
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 60, state: steady}
      - {start_s: 60, duration_s: 270, state: fault}
      - {start_s: 330, duration_s: 90, state: recovery}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    faults:
      - kind: super_temperature
        target_tag: TI-203
        start_s: 60
        duration_s: 270
    expected:
      should_detect: true
      fault_type: super_temperature
      target_tag: TI-203
      max_latency_s: 45
      max_false_alarms: 0
    tags: [thermal, safety-critical]

  - id: CASE-FAULT-002
    name: 反应器压力累积上升
    description: 压力以受控速率上升并越过安全上限，验证超压诊断与联锁前的时间裕度。
    category: fault
    source: simulation
    provenance: demo_reactor 合成超压故障，参数为演示假设，非真实装置数据
    seed: 20260202
    duration_s: 540
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 60, state: steady}
      - {start_s: 60, duration_s: 420, state: fault}
      - {start_s: 480, duration_s: 60, state: recovery}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    faults:
      - kind: over_pressure
        target_tag: PI-203
        start_s: 60
        duration_s: 420
    expected:
      should_detect: true
      fault_type: over_pressure
      target_tag: PI-203
      max_latency_s: 150
      max_false_alarms: 0
    tags: [pressure, safety-critical]

  - id: CASE-FAULT-003
    name: 温度变送器缓慢漂移
    description: 过程真实状态不变，TI-203 测量值缓慢单向偏移，验证测量故障与过程故障的区分。
    category: fault
    source: simulation
    provenance: demo_reactor 合成仪表漂移故障，参数为演示假设，非真实装置数据
    seed: 20260203
    duration_s: 360
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 60, state: steady}
      - {start_s: 60, duration_s: 240, state: fault}
      - {start_s: 300, duration_s: 60, state: recovery}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    faults:
      - kind: sensor_drift
        target_tag: TI-203
        start_s: 60
        duration_s: 240
    expected:
      should_detect: true
      fault_type: sensor_drift
      target_tag: TI-203
      max_latency_s: 180
      max_false_alarms: 0
    tags: [instrument, drift]

  - id: CASE-FAULT-004
    name: 进料调节阀卡涩
    description: 负荷阶跃测试激励后阀位锁定，流量不跟随设定值，验证执行机构故障诊断。
    category: fault
    source: simulation
    provenance: demo_reactor 合成阀门卡涩故障，参数为演示假设，非真实装置数据
    seed: 20260204
    duration_s: 360
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 90, state: steady}
      - {start_s: 90, duration_s: 180, state: fault}
      - {start_s: 270, duration_s: 90, state: recovery}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    faults:
