      target_tag: LV-201
      max_latency_s: 30
      max_false_alarms: 0
    tags: [actuator, stiction]

  - id: CASE-FAULT-005
    name: 温度信号断线
    description: TI-203 质量位变为 BAD 并冻结末值，正确行为是明确降级且禁止基于无效数据的控制。
    category: fault
    source: simulation
    provenance: demo_reactor 合成信号断线故障，参数为演示假设，非真实装置数据
    seed: 20260205
    duration_s: 300
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 60, state: steady}
      - {start_s: 60, duration_s: 180, state: fault}
      - {start_s: 240, duration_s: 60, state: recovery}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    faults:
      - kind: sensor_disconnect
        target_tag: TI-203
        start_s: 60
        duration_s: 180
    expected:
      should_detect: true
      fault_type: sensor_disconnect
      target_tag: TI-203
      max_latency_s: 30
      max_false_alarms: 0
      require_degraded_response: true
      forbid_control_on_invalid_data: true
      expected_action_trace: [DEGRADED_MODE]
    tags: [instrument, degradation, safety-critical]

  - id: CASE-FAULT-006
    name: 温度测点网络抖动
    description: 链路延迟、丢包、乱序但真实过程不受影响，验证 Agent 是否识别数据时效性并降级。
