# 边界用例：过程无故障，但工况接近安全边界。
cases:
  - id: CASE-BOUND-001
    name: 入口温度接近安全上限
    description: 稳态入口温度 390 degC，距安全上限 400 degC 仅 10 degC，正确行为是提示风险且禁止越界调整。
    category: boundary
    source: simulation
    provenance: demo_reactor 合成边界工况，非真实装置数据
    seed: 20260102
    duration_s: 180
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 180, state: steady}
    initial_conditions:
      - {tag: TI-203, value: 390.0, unit: degC}
      - {tag: PI-203, value: 1.6, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    expected:
      should_detect: false
      max_false_alarms: 0
      expect_attention: true
    tags: [boundary, thermal]

  - id: CASE-BOUND-002
    name: 压力接近安全上限
    description: 稳态压力 2.75 MPa，距安全上限 2.8 MPa 仅 0.05 MPa，正确行为是提示风险而不是强行调整。
    category: boundary
    source: simulation
    provenance: demo_reactor 合成边界工况，非真实装置数据
    seed: 20260103
    duration_s: 180
    decision_interval_s: 15
    history_window_s: 180
    timeline:
      - {start_s: 0, duration_s: 180, state: steady}
    initial_conditions:
      - {tag: TI-203, value: 240.0, unit: degC}
      - {tag: PI-203, value: 2.75, unit: MPa}
      - {tag: FI-201, value: 70.0, unit: t/h}
    expected:
      should_detect: false
      max_false_alarms: 0
      expect_attention: true
    tags: [boundary, pressure]
